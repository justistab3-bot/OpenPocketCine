name: Android Chinese APK
run-name: Android Simplified Chinese APK
on:
  push:
    branches: [feat/android-zh-delivery-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: OpenPocketCine
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: justistab3-bot/OpenCine
          ref: a872799e8adcc1a627d654e17e91b07188add3be
          path: OpenCine
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Stage verified upstream native libraries
        working-directory: OpenPocketCine
        run: python3 .github/scripts/stage-chinese-native.py
      - name: Build Chinese APK (no tests)
        working-directory: OpenPocketCine/Apps/Android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -x :app:stageSwiftCore --no-configuration-cache --console=plain --max-workers=4
      - name: Package APK and checksums
        working-directory: OpenPocketCine
        run: |
          mkdir -p chinese-apk
          cp Apps/Android/app/build/outputs/apk/debug/app-debug.apk chinese-apk/OpenPocketCine-0.1.5-zh-arm64.apk
          cd chinese-apk
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: OpenPocketCine-0.1.5-zh-arm64
          path: OpenPocketCine/chinese-apk/
          retention-days: 14
          if-no-files-found: error
